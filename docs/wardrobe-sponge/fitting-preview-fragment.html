<script>
(()=>{
  'use strict';
// Atomic outfit changes: retain the current complete character until every new layer loads.
// All layers stay inside char-inner, sharing the original breathing/dragging/peek animations.
class NeroWardrobeRenderer {
  constructor({ catalog, scale, slots, base, changed, makeImage = () => new Image() }) {
    Object.assign(this, { catalog: catalog || {}, scale, slots, base, changed, makeImage });
    this.selected = null; this.active = null; this.generation = 0; this.disposed = false;
  }
  select(id) {
    id = this.catalog[id] ? id : null;
    if (id === this.selected || this.disposed) return;
    this.selected = id;
    const generation = ++this.generation;
    if (!id) { this.install(this.base, null); return; }
    const layers = this.catalog[id].layers;
    const bundle = {};
    const pending = [];
    for (const [layer, variants] of Object.entries(layers)) {
      bundle[layer] = {};
      for (const [variant, url] of Object.entries(variants)) {
        const img = this.makeImage();
        img.crossOrigin = 'anonymous'; img.draggable = false; img.alt = '';
        img.className = `layer layer-${layer}`; img.dataset.variant = variant;
        Object.assign(img.style, { left:'0px', top:'0px', width:`${220*this.scale}px`, height:`${260*this.scale}px` });
        pending.push(new Promise((resolve,reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error(`Kıyafet katmanı yüklenemedi: ${url}`));
          img.src = url;
        }));
        bundle[layer][variant] = img;
      }
    }
    Promise.all(pending).then(() => {
      if (!this.disposed && generation === this.generation) this.install(bundle,id);
    }).catch(err => {
      if (!this.disposed && generation === this.generation) {
        console.error(err);
        this.install(this.base,null);
      }
    });
  }
  install(bundle,id) {
    for (const layer of Object.keys(this.base)) {
      const variants = bundle[layer] || {};
      this.slots[layer].replaceChildren(...Object.values(variants));
    }
    this.active = id;
    this.changed(bundle,id);
  }
  dispose() { this.disposed = true; ++this.generation; }
}

  const root=document.getElementById('nero-costume-fitting');
  const assets=JSON.parse(document.getElementById('nero-fitting-assets').textContent);
  const controls={};for(const n of root.querySelectorAll('[data-fitting]'))controls[n.dataset.fitting]=n;
  const slots={};for(const n of root.querySelectorAll('[data-layer]'))slots[n.dataset.layer]=n;
  const saved=window.openai?.widgetState?.privateContent||{};
  let costume=['sponge','denim'].includes(saved.costume)?saved.costume:'sponge',worn=saved.worn!==false,blinkTimer;
  const base={};for(const [layer,variants]of Object.entries(assets.base)){base[layer]={};for(const [variant,url]of Object.entries(variants)){const img=new Image();img.src=url;img.className='layer';img.alt='';base[layer][variant]=img;}}
  let current=base;
  function expression(closed=true){for(const [layer,variants]of Object.entries(current)){const variant={body:'default',eyes:'default',pupils:'default',lids:closed?'closed':'heavy',brows:'normal',mouth:'neutral'}[layer];for(const [key,img]of Object.entries(variants))img.hidden=key!==variant;}}
  const renderer=new NeroWardrobeRenderer({catalog:assets.catalog,scale:1,slots,base,changed(bundle,id){current=bundle;expression();root.dataset.activeOutfit=id||'none';controls.status.textContent=id==='sponge'?'SpongeBob taslağı giyili':id==='denim'?'Mevcut kot ceket giyili':'Kıyafet çıkarıldı';}});
  renderer.install(base,null);
  function render(){clearTimeout(blinkTimer);controls.costume.value=costume;controls.wear.setAttribute('aria-pressed',String(worn));controls.remove.setAttribute('aria-pressed',String(!worn));renderer.select(worn?costume:null);}
  function remember(){window.openai?.setWidgetState?.({modelContent:{costume,worn},privateContent:{costume,worn}})?.catch(()=>{});}
  controls.wear.onclick=()=>{worn=true;render();remember();};
  controls.remove.onclick=()=>{worn=false;render();remember();};
  controls.costume.onchange=()=>{costume=controls.costume.value;render();remember();};
  controls.blink.onclick=()=>{clearTimeout(blinkTimer);expression(false);blinkTimer=setTimeout(()=>expression(true),650);};
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(!next)return;costume=['sponge','denim'].includes(next.costume)?next.costume:costume;worn=next.worn!==false;render();});
  render();
})();
</script>
