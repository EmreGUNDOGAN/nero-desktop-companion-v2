(()=&gt;{
  &#x27;use strict&#x27;;
// Atomic outfit changes: retain the current complete character until every new layer loads.
// All layers stay inside char-inner, sharing the original breathing/dragging/peek animations.
class NeroWardrobeRenderer {
  constructor({ catalog, scale, slots, base, changed, makeImage = () =&gt; new Image() }) {
    Object.assign(this, { catalog: catalog || {}, scale, slots, base, changed, makeImage });
    this.selected = null; this.active = null; this.generation = 0; this.disposed = false;
  }
  select(id) {
    id = this.catalog[id] ? id : null;
    if (id === this.selected || this.disposed) return;
    this.selected = id;
    const generation = ++this.generation;
    if (!id) { this.install(this.base, null); return; }
    const layers = this.catalog[id].layers;
    const bundle = {};
    const pending = [];
    for (const [layer, variants] of Object.entries(layers)) {
      bundle[layer] = {};
      for (const [variant, url] of Object.entries(variants)) {
        const img = this.makeImage();
        img.crossOrigin = &#x27;anonymous&#x27;; img.draggable = false; img.alt = &#x27;&#x27;;
        img.className = `layer layer-${layer}`; img.dataset.variant = variant;
        Object.assign(img.style, { left:&#x27;0px&#x27;, top:&#x27;0px&#x27;, width:`${220*this.scale}px`, height:`${260*this.scale}px` });
        pending.push(new Promise((resolve,reject) =&gt; {
          img.onload = resolve;
          img.onerror = () =&gt; reject(new Error(`Kıyafet katmanı yüklenemedi: ${url}`));
          img.src = url;
        }));
        bundle[layer][variant] = img;
      }
    }
    Promise.all(pending).then(() =&gt; {
      if (!this.disposed &amp;&amp; generation === this.generation) this.install(bundle,id);
    }).catch(err =&gt; {
      if (!this.disposed &amp;&amp; generation === this.generation) {
        console.error(err);
        this.install(this.base,null);
      }
    });
  }
  install(bundle,id) {
    for (const layer of Object.keys(this.base)) {
      const variants = bundle[layer] || {};
      this.slots[layer].replaceChildren(...Object.values(variants));
    }
    this.active = id;
    this.changed(bundle,id);
  }
  dispose() { this.disposed = true; ++this.generation; }
}

  const root=document.getElementById(&#x27;nero-squidward-fitting&#x27;);
  const assets=JSON.parse(document.getElementById(&#x27;nero-squidward-assets&#x27;).textContent);
  const controls={};for(const n of root.querySelectorAll(&#x27;[data-fitting]&#x27;))controls[n.dataset.fitting]=n;
  const slots={};for(const n of root.querySelectorAll(&#x27;[data-layer]&#x27;))slots[n.dataset.layer]=n;
  const saved=window.openai?.widgetState?.privateContent||{},version=root.dataset.previewVersion;
  const validSaved=saved.version===version&amp;&amp;Object.hasOwn(assets.catalog,saved.costume);
  let costume=validSaved?saved.costume:root.dataset.reviewCostume,worn=validSaved?saved.worn!==false:true,blinkTimer;
  const base={};for(const [layer,variants]of Object.entries(assets.base)){base[layer]={};for(const [variant,url]of Object.entries(variants)){const img=new Image();img.src=url;img.className=&#x27;layer&#x27;;img.alt=&#x27;&#x27;;base[layer][variant]=img;}}
  let current=base;
  function expression(closed=true){for(const [layer,variants]of Object.entries(current)){const variant={body:&#x27;default&#x27;,eyes:&#x27;default&#x27;,pupils:&#x27;default&#x27;,lids:closed?&#x27;closed&#x27;:&#x27;heavy&#x27;,brows:&#x27;normal&#x27;,mouth:&#x27;neutral&#x27;}[layer];for(const [key,img]of Object.entries(variants))img.hidden=key!==variant;}}
  const renderer=new NeroWardrobeRenderer({catalog:assets.catalog,scale:1,slots,base,changed(bundle,id){current=bundle;expression();root.dataset.activeOutfit=id||&#x27;none&#x27;;controls.status.textContent=id?assets.labels[id]+&#x27; giyili&#x27;:&#x27;Kıyafet çıkarıldı&#x27;;}});
  renderer.install(base,null);
  function render(){clearTimeout(blinkTimer);controls.costume.value=costume;controls.wear.setAttribute(&#x27;aria-pressed&#x27;,String(worn));controls.remove.setAttribute(&#x27;aria-pressed&#x27;,String(!worn));renderer.select(worn?costume:null);}
  function remember(){window.openai?.setWidgetState?.({modelContent:{costume,worn},privateContent:{costume,worn,version}})?.catch(()=&gt;{});}
  controls.wear.onclick=()=&gt;{worn=true;render();remember();};
  controls.remove.onclick=()=&gt;{worn=false;render();remember();};
  controls.costume.onchange=()=&gt;{costume=controls.costume.value;render();remember();};
  controls.blink.onclick=()=&gt;{clearTimeout(blinkTimer);expression(false);blinkTimer=setTimeout(()=&gt;expression(true),650);};
  window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{const next=event.detail?.globals?.widgetState?.privateContent;if(!next||next.version!==version)return;costume=Object.hasOwn(assets.catalog,next.costume)?next.costume:costume;worn=next.worn!==false;render();});
  render();
})();

    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
