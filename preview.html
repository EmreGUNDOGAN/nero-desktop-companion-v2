<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nero · Üç Tema</title><link rel="stylesheet" href="src/renderer/fonts/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.4 'Nunito',sans-serif;background:#ece7df;color:#29382c}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:0 0 18px}h1{font:600 30px/1.2 'Fraunces',serif;margin:0}p{margin:5px 0 0;color:#6a7269}select,button{font:inherit;border:1px solid #87968b;background:#fff8ed;color:#29382c;border-radius:6px;padding:8px}nav{display:flex;gap:8px;align-items:center}.screens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0}figcaption{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px 8px;font-weight:700;font-size:18px}figcaption small{font-size:11px;font-weight:400;color:#6a7269}img{display:block;width:100%;height:auto;box-shadow:0 8px 24px #0002;border-radius:10px}footer{margin-top:18px;font-size:12px;color:#6a7269}.capture nav{display:none}.capture{overflow:hidden}body[data-theme=arcade-molasi]{background:#281e38;color:#ffe4c4}body[data-theme=arcade-molasi] h1{font-family:'VT323',monospace;font-size:38px}body[data-theme=arcade-molasi] p,body[data-theme=arcade-molasi] small,body[data-theme=arcade-molasi] footer{color:#c6b4ce}body[data-theme=yorunge]{background:#0b141d;color:#e9e5da}body[data-theme=yorunge] h1{font-family:'Nunito',sans-serif}body[data-theme=yorunge] p,body[data-theme=yorunge] small,body[data-theme=yorunge] footer{color:#91b3c3}body[data-theme=serada-bir-gun]{background:#ece7d6}@media(max-width:800px){header{flex-wrap:wrap}.screens{grid-template-columns:1fr}figure{max-width:500px;margin:auto}}
</style><body><header><div><h1 id="title"></h1><p>Çalışan uygulamadan alınan ekran görüntüleri</p></div><nav><select id="themes" aria-label="Tema"><option value="arcade-molasi">Arcade Molası</option><option value="yorunge">Yörünge</option><option value="serada-bir-gun">Serada Bir Gün</option></select><button id="pages">Diğer üç ekran</button></nav></header><main class="screens" id="screens"></main><footer>Yerel ikonlar ve çizimler · Canlı notlar, işler, grafik ve sayaç · Bu görüntülerde yalnızca örnek test kayıtları kullanılır.</footer><script>
const names={'arcade-molasi':'Arcade Molası',yorunge:'Yörünge','serada-bir-gun':'Serada Bir Gün'},labels={home:'Bugün',notes:'Notlar',timer:'Sayaç',todos:'İşler',badges:'Rozetler',settings:'Ayarlar'};const params=new URLSearchParams(location.search);let theme=Object.hasOwn(names,params.get('theme'))?params.get('theme'):'arcade-molasi',extra=false;
if(params.has('capture'))document.body.classList.add('capture');document.getElementById('themes').value=theme;
function render(){document.body.dataset.theme=theme;document.getElementById('title').textContent='Nero · '+names[theme];const tabs=extra?['todos','badges','settings']:['home','notes','timer'];document.getElementById('screens').replaceChildren(...tabs.map(tab=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),s=document.createElement('small'),i=document.createElement('img');c.textContent=labels[tab];s.textContent='Gerçek uygulama';c.append(s);i.src='docs/theme-trio/screens/'+theme+'-'+tab+'.png';i.alt=names[theme]+' · '+labels[tab];f.append(c,i);return f;}));window.previewReady=Promise.all([...document.images].map(i=>i.decode())).then(()=>document.fonts.ready);}
document.getElementById('themes').onchange=e=>{theme=e.target.value;render()};document.getElementById('pages').onclick=e=>{extra=!extra;e.target.textContent=extra?'İlk üç ekran':'Diğer üç ekran';render()};render();
</script></body></html>
