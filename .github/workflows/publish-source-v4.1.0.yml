name: Publish Nero 4.1.0 source branch

on:
  push:
    branches: [source-prep-v4.1.0]

permissions:
  contents: write

jobs:
  source:
    runs-on: windows-latest
    steps:
      - name: Hazırlık dalını al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4.0.4 tam kaynak paketini indir
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path base | Out-Null
          gh release download v4.0.4 --pattern "nero-v4.0.4-kaynak.zip" --dir base
          if (-not (Test-Path "base/nero-v4.0.4-kaynak.zip")) { throw "4.0.4 kaynak paketi bulunamadı." }

          Expand-Archive "base/nero-v4.0.4-kaynak.zip" "base/extracted" -Force
          $root = Get-ChildItem "base/extracted" -Directory | Where-Object { Test-Path (Join-Path $_.FullName "package.json") } | Select-Object -First 1
          if (-not $root -and (Test-Path "base/extracted/package.json")) { $root = Get-Item "base/extracted" }
          if (-not $root) { throw "Kaynak kök klasörü bulunamadı." }

          New-Item -ItemType Directory -Force -Path project | Out-Null
          Get-ChildItem $root.FullName -Force | ForEach-Object { Copy-Item $_.FullName "project" -Recurse -Force }

      - name: 4.1.0 Home Dialogue patchlerini uygula
        shell: pwsh
        run: |
          $raw = Get-Content "build-input/NERO_v4.0.4_to_v4.1.0.patch" -Raw
          $raw = $raw.Replace("/tmp/nero404_orig/nero/","a/").Replace("/mnt/data/nero410_work/nero/","b/")
          [IO.File]::WriteAllText((Join-Path $PWD "main-normalized.patch"), $raw, [Text.UTF8Encoding]::new($false))
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../main-normalized.patch || true"

          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../build-input/NERO_4.1.0_click_fix.patch || true"

      - name: 125 achievement patchini uygula
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-input/achievements-runtime-b64.part*" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Achievement patch parçaları eksik." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD "ach.patch.gz"), [Convert]::FromBase64String($b64))
          if ((Get-FileHash "ach.patch.gz" -Algorithm SHA256).Hash.ToLower() -ne "e41f62c2c7220ec9d3f8251ef769325a6dbc8f024c254eb17f4b144e324f282c") { throw "Achievement patch checksum hatası." }

          & "C:\Program Files\Git\bin\bash.exe" -lc "gzip -dc ach.patch.gz > ach.raw.patch"
          $raw = Get-Content "ach.raw.patch" -Raw
          $raw = $raw.Replace("nero410_base_for_ach/nero/","a/").Replace("nero411_work/nero/","b/")
          [IO.File]::WriteAllText((Join-Path $PWD "ach-normalized.patch"), $raw, [Text.UTF8Encoding]::new($false))
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../ach-normalized.patch"
          if ($LASTEXITCODE -ne 0) { throw "Achievement patch uygulanamadı." }

      - name: Rozet nadirlik sekmelerini uygula
        shell: pwsh
        run: |
          $b64 = Get-Content "build-input/badges-rarity-tabs.patch.b64" -Raw
          [IO.File]::WriteAllBytes((Join-Path $PWD "badges-rarity-tabs.patch"), [Convert]::FromBase64String($b64))
          if ((Get-FileHash "badges-rarity-tabs.patch" -Algorithm SHA256).Hash.ToLower() -ne "5292fb57f640f2f34ad604b7e14e32b51d8992ffc6cbc5d91842bed53c3d69b7") { throw "Rarity patch checksum hatası." }
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../badges-rarity-tabs.patch"
          if ($LASTEXITCODE -ne 0) { throw "Rarity sekmeleri uygulanamadı." }

      - name: Tüm tema istatistik düzenini uygula
        shell: pwsh
        run: |
          $raw = Get-Content "build-input/home-stats-layout.patch" -Raw
          $raw = $raw.Replace("nero_ui_base/nero/","a/").Replace("nero_ui_fix/nero/","b/")
          [IO.File]::WriteAllText((Join-Path $PWD "home-stats-normalized.patch"), $raw, [Text.UTF8Encoding]::new($false))
          # CHANGELOG ana patch/click-fix sırasında değiştiği için yalnız o hunk çakışabilir;
          # CSS ve test hunks uygulanır, ardından aşağıdaki doğrulamalar layout'u kesin olarak kontrol eder.
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../home-stats-normalized.patch || true"

          $changelog = Get-Content "project/CHANGELOG.md" -Raw
          if ($changelog -notmatch 'Tüm temalarda ana sayfa istatistik alanı yeniden sıkılaştırıldı') {
            $marker = '### Değişti'
            $lines = @(
              '### Düzeltildi',
              '- **Tüm temalarda ana sayfa istatistik alanı yeniden sıkılaştırıldı:** dört günlük istatistik kartı gereksiz dikey boşluk bırakmıyor.',
              '- **Bu hafta odak grafiği kompaktlaştırıldı;** grafik alanı paneli gereksiz yere uzatmıyor.',
              '- Disket, Kasaba, Yağmur, Kar, Çilekli Piknik, Mum Işığı ve Ege Yazı temalarının özel istatistik stilleri ortak boyut kurallarıyla çakışmayacak şekilde düzenlendi.',
              '- Hava/resimli temalardaki sonradan gelen CSS override artık kartları tekrar 110px yüksekliğe zorlamıyor.',
              ''
            )
            $note = ($lines -join [Environment]::NewLine) + [Environment]::NewLine
            $changelog = $changelog.Replace($marker, $note + $marker)
          }
          $oldClick = '- Konuşma kartına tıklayınca mevcut Home cümlesi gizlenebilir; bu işlem yeni replik üretmez.'
          $newClick = '- Konuşma kartına tıklamak mevcut Home cümlesini artık gizlemez; replik yalnızca otomatik zamanlayıcıyla değişir.'
          $changelog = $changelog.Replace($oldClick, $newClick)
          [IO.File]::WriteAllText((Join-Path $PWD "project/CHANGELOG.md"), $changelog, [Text.UTF8Encoding]::new($false))

      - name: Arşiv Moodboard ve Ayarlar görevlerini uygula
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-input/archive-moodboard-settings-b64.part*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Arşiv/Moodboard/Ayarlar patch parçaları eksik: $($parts.Count)/4" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD "impl.patch.gz"), [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "impl.patch.gz" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "b3cd65cdab9f98aef7db9826244327c850683a9261db97a9ecbdf09fb433c959") { throw "Arşiv/Moodboard/Ayarlar patch checksum hatası: $hash" }

          & "C:\Program Files\Git\bin\bash.exe" -lc "gzip -dc impl.patch.gz > impl.raw.patch"
          if ($LASTEXITCODE -ne 0) { throw "Implementasyon patch gzip açılamadı." }
          $raw = Get-Content "impl.raw.patch" -Raw
          $raw = $raw.Replace("/mnt/data/nero_baseline/nero/","a/").Replace("/mnt/data/nero_impl/nero/","b/")
          [IO.File]::WriteAllText((Join-Path $PWD "impl-normalized.patch"), $raw, [Text.UTF8Encoding]::new($false))
          # CHANGELOG hunk'ı bir önceki tema düzeltmesi tarafından aynı bölgede değiştirildiği için
          # yalnız CHANGELOG çakışmasına izin veriyoruz; diğer kaynak hunks daha sonra doğrulanır.
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../impl-normalized.patch || true"

          $rejects = Get-ChildItem "project" -Recurse -File -Filter "*.rej"
          $unexpected = $rejects | Where-Object { $_.Name -ne "CHANGELOG.md.rej" }
          if ($unexpected) { throw "Implementasyon patch'inde beklenmeyen reject var: $($unexpected.FullName -join ', ')" }

          $changelog = Get-Content "project/CHANGELOG.md" -Raw
          if ($changelog -notmatch '### Arşiv, Moodboard ve Ayarlar düzeni') {
            $marker = '### Achievement sistemi v2'
            $lines = @(
              '### Arşiv, Moodboard ve Ayarlar düzeni',
              '- **İşler arşivi:** tamamlanan işler artık kullanıcı istediğinde manuel olarak arşivlenebilir; İşler sayfasının altındaki Arşivler alanında ay ay açılır/kapanır gruplarda tutulur ve geri alınabilir.',
              '- **Not arşivi:** notlar manuel olarak arşivlenebilir; aktif not listesinden çıkar, aylık Arşivler bölümünde saklanır ve geri alınabilir.',
              '- Ana sayfadaki **“Bu ay yaptıkların”** bölümü ilk 5 işi gösterir; daha fazlası açılır/kapanır bir listede tutulur. En yeni tamamlanan iş her zaman üsttedir.',
              '- **Benim Moodboard’um:** ayın her günü için kullanıcı yeşil/sarı/kırmızı seçim yapabilir; gelecek günler seçilemez ve ay değişince yeni ay boş başlar.',
              '- **Nero’nun Moodboard’u:** mevcut otomatik happiness günlüğü korunarak son 30 gün yerine gerçek takvim ayı görünümüne taşındı.',
              '- Kapanmış ayların kullanıcı + Nero moodboard’u birlikte **PNG olarak Resimler/Nero Moodboards** klasörüne kaydedilir; ham JSON geçmişi silinmez.',
              '- Moodboard tasarımı ve arşiv bileşenleri tüm yerleşik temaların görsel diline uyarlanır.',
              '- **Ayarlar** ana sekme çubuğundan kaldırıldı ve üst sağda, pin düğmesinin solunda tema uyumlu bir dişli düğmesine taşındı.',
              '- Yeni arşiv ve moodboard verileri Nero''nun dışa aktarma / otomatik yedek snapshot''ına dahil edildi.',
              ''
            )
            $section = ($lines -join [Environment]::NewLine) + [Environment]::NewLine
            $changelog = $changelog.Replace($marker, $section + $marker)
            [IO.File]::WriteAllText((Join-Path $PWD "project/CHANGELOG.md"), $changelog, [Text.UTF8Encoding]::new($false))
          }
          $rejects | Remove-Item -Force

      - name: Kaynak bütünlüğünü test et
        shell: pwsh
        working-directory: project
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "4.1.0") { throw "Sürüm 4.1.0 değil." }

          $dialogue = Get-Content "src/data/home-dialogues.tr.json" -Raw | ConvertFrom-Json
          if ($dialogue.dialogues.Count -ne 665) { throw "665 Home repliği eksik." }

          node -e "const a=require('./src/data/achievements'); const c=r=>a.filter(x=>x.rarity===r).length; if(a.length!==125||new Set(a.map(x=>x.id)).size!==125||c('yaygin')!==25||c('siradisi')!==35||c('nadir')!==20||c('efsanevi')!==20||c('gizli')!==25) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw "125 achievement dağılımı hatalı." }

          $css = Get-Content "src/renderer/panel/panel.css" -Raw
          $skins = Get-Content "src/renderer/panel/skins.css" -Raw
          if ($css -notmatch 'min-height:\s*86px' -or $css -notmatch 'height:\s*76px') { throw "Kompakt ortak istatistik layout'u eksik." }
          if ($skins -match 'min-height:\s*150px' -or $skins -match 'min-height:\s*128px') { throw "Eski büyük tema ölçüleri hâlâ mevcut." }
          if ($skins -match 'grid-template-rows:\s*28px auto auto;\s*align-content:\s*start;\s*min-height:\s*110px') { throw "110px override geri gelmiş." }

          foreach ($path in @(
            "src/main/moodboard.js",
            "docs/NERO-v4.1.0-ARCHIVE-MOODBOARD-SETTINGS.md",
            "test/archive-moodboard-settings.test.js",
            "test/moodboard-electron-smoke.js"
          )) {
            if (-not (Test-Path $path)) { throw "Yeni 4.1.0 kaynak dosyası eksik: $path" }
          }

          $panelHtml = Get-Content "src/renderer/panel/index.html" -Raw
          $panelJs = Get-Content "src/renderer/panel/panel.js" -Raw
          $mainJs = Get-Content "src/main/main.js" -Raw
          $preload = Get-Content "src/preload/preload.js" -Raw
          if ($panelHtml -match 'data-tab="settings"') { throw "Ayarlar hâlâ navbar içinde." }
          if ($panelHtml -notmatch 'id="settings-button"') { throw "Üst sağ Ayarlar dişlisi eksik." }
          if (($panelHtml | Select-String -Pattern 'role="tab" data-tab=' -AllMatches).Matches.Count -ne 5) { throw "Ana navbar 5 sekme değil." }
          if ($panelHtml -match 'id="mood-strip"') { throw "Eski Son 30 gün mood-strip hâlâ mevcut." }
          if ($panelHtml -notmatch 'id="user-mood-calendar"' -or $panelHtml -notmatch 'id="nero-mood-calendar"') { throw "Çift moodboard UI eksik." }
          if ($panelJs -notmatch 'renderMoodboards' -or $panelJs -notmatch 'archive-more') { throw "Moodboard veya Home ilk-5 dropdown renderer davranışı eksik." }
          if ($mainJs -notmatch "notes:archive" -or $mainJs -notmatch "todos:archive" -or $mainJs -notmatch "todos:archiveDone" -or $mainJs -notmatch "moodboard:set") { throw "Yeni IPC implementasyonu eksik." }
          if ($preload -notmatch "notes:archive" -or $preload -notmatch "todos:archive" -or $preload -notmatch "moodboard:set") { throw "Yeni IPC preload allowlist eksik." }

          node --check src/main/main.js
          if ($LASTEXITCODE -ne 0) { throw "main.js syntax hatası." }
          node --check src/main/journal.js
          if ($LASTEXITCODE -ne 0) { throw "journal.js syntax hatası." }
          node --check src/main/moodboard.js
          if ($LASTEXITCODE -ne 0) { throw "moodboard.js syntax hatası." }
          node --check src/renderer/panel/panel.js
          if ($LASTEXITCODE -ne 0) { throw "panel.js syntax hatası." }
          node --check src/preload/preload.js
          if ($LASTEXITCODE -ne 0) { throw "preload.js syntax hatası." }

          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install başarısız." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Testler başarısız." }

      - name: Electron moodboard PNG smoke testi
        shell: pwsh
        working-directory: project
        run: |
          npx electron test/moodboard-electron-smoke.js
          if ($LASTEXITCODE -ne 0) { throw "Electron moodboard PNG smoke testi başarısız." }

      - name: Kaynak ağacını temizle
        shell: pwsh
        run: |
          if (Test-Path "project/node_modules") { Remove-Item "project/node_modules" -Recurse -Force }
          if (Test-Path "project/dist") { Remove-Item "project/dist" -Recurse -Force }
          Get-ChildItem "project" -Recurse -Force -File | Where-Object { $_.Name -match '\.(rej|orig)$' } | Remove-Item -Force
          if (Test-Path "project/.git") { Remove-Item "project/.git" -Recurse -Force }
          # GitHub App tokenı workflow dosyası yazma iznine sahip değil; kaynak dalında CI workflow'larını taşımıyoruz.
          if (Test-Path "project/.github/workflows") { Remove-Item "project/.github/workflows" -Recurse -Force }

          Compress-Archive -Path "project/*" -DestinationPath "nero-v4.1.0-kaynak.zip" -Force

      - name: Gerçek kaynak kodunu source-v4.1.0 dalına yayınla
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "nero-source-publish"
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          Get-ChildItem "project" -Force | ForEach-Object { Copy-Item $_.FullName $publish -Recurse -Force }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan source-v4.1.0
          git rm -rf . | Out-Null
          Get-ChildItem $publish -Force | ForEach-Object { Copy-Item $_.FullName "." -Recurse -Force }
          git add -A
          git commit -m "source: Nero 4.1.0 archives moodboards settings and full regression fixes"
          git push --force origin source-v4.1.0

      - name: Kaynak zipini build artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: nero-v4.1.0-kaynak
          path: nero-v4.1.0-kaynak.zip
          if-no-files-found: error
