name: Validate Nero 4.1.0 source

on:
  push:
    branches:
      - source-prep-v4.1.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Güncel 4.1.0 kaynak dalını al
        uses: actions/checkout@v4
        with:
          ref: source-v4.1.0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kaynak bütünlüğü
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "4.1.0") { throw "Sürüm 4.1.0 değil." }

          $dialogue = Get-Content "src/data/home-dialogues.tr.json" -Raw | ConvertFrom-Json
          if ($dialogue.dialogues.Count -ne 665) { throw "665 Home repliği eksik." }

          node -e "const a=require('./src/data/achievements'); const c=r=>a.filter(x=>x.rarity===r).length; if(a.length!==125||new Set(a.map(x=>x.id)).size!==125||c('yaygin')!==25||c('siradisi')!==35||c('nadir')!==20||c('efsanevi')!==20||c('gizli')!==25) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw "125 achievement dağılımı hatalı." }

          foreach ($path in @(
            "src/main/main.js",
            "src/main/journal.js",
            "src/main/moodboard.js",
            "src/main/moodboard-image.js",
            "src/preload/preload.js",
            "src/renderer/panel/panel.js"
          )) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax hatası: $path" }
          }

      - name: Task spec regresyon kontrolleri
        shell: pwsh
        run: |
          $html = Get-Content "src/renderer/panel/index.html" -Raw
          $panel = Get-Content "src/renderer/panel/panel.js" -Raw
          $main = Get-Content "src/main/main.js" -Raw
          $preload = Get-Content "src/preload/preload.js" -Raw
          $skins = Get-Content "src/renderer/panel/skins.css" -Raw

          if ($html -match 'data-tab="settings"') { throw "Ayarlar navbar içinde kalmış." }
          if ($html -notmatch 'id="settings-button"') { throw "Ayarlar dişlisi eksik." }
          if ($html -notmatch 'id="user-mood-calendar"' -or $html -notmatch 'id="nero-mood-calendar"') { throw "Çift moodboard eksik." }
          if ($html -match 'id="mood-strip"') { throw "Eski Son 30 gün mood grid hâlâ mevcut." }
          if ($html -notmatch 'id="notes-archive"' -or $html -notmatch 'id="todos-archive"') { throw "Arşiv drawerları eksik." }
          if ($html -notmatch 'id="archive-more"') { throw "Home ilk-5 dropdown eksik." }

          foreach ($channel in @("notes:archive","notes:unarchive","todos:archive","todos:unarchive","todos:archiveDone","moodboard:set")) {
            if ($main -notmatch [regex]::Escape($channel)) { throw "Main IPC eksik: $channel" }
            if ($preload -notmatch [regex]::Escape($channel)) { throw "Preload IPC eksik: $channel" }
          }

          foreach ($skin in @("latte","pazartesi","gece","disket","kasaba","yagmur","kar","cilek","mum","ege")) {
            if ($skins -notmatch [regex]::Escape($skin)) { throw "Tema stili eksik: $skin" }
          }
          if ($skins -notmatch 'settings-btn' -or $skins -notmatch 'mood-calendar') { throw "Tema uyumlu dişli/moodboard stilleri eksik." }

      - name: Bağımlılıkları kur
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install başarısız." }

      - name: Tüm Node testlerini çalıştır
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Node testleri başarısız." }

      - name: Gerçek Electron PNG smoke testi
        shell: pwsh
        run: |
          if (-not (Test-Path "test/moodboard-electron-smoke.js")) { throw "Electron smoke testi eksik." }
          $out = @(npx electron test/moodboard-electron-smoke.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "Electron PNG smoke testi başarısız." }
          if (($out -join [Environment]::NewLine) -notmatch "moodboard-electron-smoke: ok") { throw "PNG smoke başarı işareti yok." }

      - name: EXE üretilmediğini doğrula
        shell: pwsh
        run: |
          if (Test-Path "dist") { throw "Bu aşamada dist oluşturulmamalı." }
          if (Get-ChildItem "." -Recurse -File -Filter "Nero-Setup-*.exe" | Select-Object -First 1) { throw "Bu aşamada EXE oluşturulmamalı." }

      - name: Kaynak ZIP hazırla
        shell: pwsh
        run: |
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          if (Test-Path ".git") { Remove-Item ".git" -Recurse -Force }
          if (Test-Path ".github/workflows") { Remove-Item ".github/workflows" -Recurse -Force }
          Compress-Archive -Path "*" -DestinationPath "nero-v4.1.0-kaynak-validated.zip" -Force

      - name: Kaynak ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nero-v4.1.0-kaynak-validated
          path: nero-v4.1.0-kaynak-validated.zip
          if-no-files-found: error
