name: Apply Nero 6.6.5 Source

on:
  push:
    branches: [feature/bee-v6.6.5]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct source payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.github/nero665/part-*' | Sort-Object Name
          if ($parts.Count -ne 60) { throw "Expected 60 payload parts, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes('nero665-payload.zip', $bytes)
          $hash = (Get-FileHash nero665-payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'be4047c14d091f23263fdea89fc7b8f6e4afaa1db58ae850d9a92b168eac0e57') {
            throw "Payload SHA-256 mismatch: $hash"
          }
          Expand-Archive -Path nero665-payload.zip -DestinationPath . -Force

      - name: Apply source cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content '.nero665-delete.json' -Raw | ConvertFrom-Json
          foreach ($dir in $manifest.delete_dirs) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }
          foreach ($file in $manifest.delete_files) {
            if (Test-Path $file) { Remove-Item $file -Force }
          }
          Remove-Item '.nero665-delete.json' -Force
          Remove-Item 'nero665-payload.zip' -Force

      - name: Install dependencies
        run: npm ci

      - name: Generate Nero 6.6.5 wardrobe layers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-save --package-lock=false sharp
          npm run wardrobe:build-new
          node scripts/wardrobe-v665/check-release.js

      - name: Run tests
        run: npm test

      - name: Validate dialogue
        run: npm run dialogue:check

      - name: Finalize source branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/nero665' -Recurse -Force
          Remove-Item '.github/workflows/apply-v6.6.5.yml' -Force\n          Remove-Item '.github/workflows/build-v6.6.5.yml' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'No 6.6.5 source changes were produced' }
          git commit -m 'release: prepare Nero 6.6.5 source'
          git push origin HEAD:feature/bee-v6.6.5
