name: Publish Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v3.8.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Nero-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "dist/SHA256SUMS.txt"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
          }

          $notesFile = "docs/releases/$tag.md"
          $installer = (Get-ChildItem "dist/Nero-Setup-*.exe" | Select-Object -First 1).FullName

          if (gh release view $tag 2>$null) {
            gh release upload $tag $installer "dist/SHA256SUMS.txt" --clobber
          } else {
            if (Test-Path $notesFile) {
              gh release create $tag $installer "dist/SHA256SUMS.txt" --title "Nero $($tag.TrimStart('v'))" --notes-file $notesFile
            } else {
              gh release create $tag $installer "dist/SHA256SUMS.txt" --title "Nero $($tag.TrimStart('v'))" --generate-notes
            }
          }
