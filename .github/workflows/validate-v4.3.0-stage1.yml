name: Validate Nero 4.3.0 stage 1

on:
  push:
    branches:
      - validate-v4.3.0-stage1

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci başarısız." }

      - name: Sözdizimi kontrolleri
        shell: pwsh
        run: |
          foreach ($path in @(
            "src/main/main.js",
            "src/main/stats.js",
            "src/main/todo-stopwatch.js",
            "src/preload/preload.js",
            "src/renderer/panel/panel.js"
          )) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax hatası: $path" }
          }

      - name: Tüm testleri çalıştır
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Testler başarısız." }

      - name: 4.3.0 sürüm ve stage 1 kaynak kontrolü
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version.Trim() -ne "4.3.0") { throw "Sürüm 4.3.0 değil." }

          $html = Get-Content "src/renderer/panel/index.html" -Raw
          $main = Get-Content "src/main/main.js" -Raw
          $panel = Get-Content "src/renderer/panel/panel.js" -Raw

          if ($html -notmatch 'id="todo-duration"') { throw "Planlanan süre alanı eksik." }
          if ($main -notmatch "todos:stopwatchStart" -or $main -notmatch "todos:stopwatchPause") { throw "Stopwatch IPC eksik." }
          if ($panel -notmatch "todo-stopwatch" -or $panel -notmatch "Gerçek:") { throw "Stopwatch UI/süre damgası eksik." }

      - name: Checkpoint kaynak ZIP oluştur
        shell: pwsh
        run: |
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          if (Test-Path ".git") { Remove-Item ".git" -Recurse -Force }
          if (Test-Path ".github/workflows") { Remove-Item ".github/workflows" -Recurse -Force }
          Compress-Archive -Path "*" -DestinationPath "Nero-v4.3.0-checkpoint-01-todo-timing.zip" -Force

      - name: Checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nero-v4.3.0-checkpoint-01-todo-timing
          path: Nero-v4.3.0-checkpoint-01-todo-timing.zip
          if-no-files-found: error
