name: Build Nero 6.3.1 Final Bundle

on:
  push:
    branches: [feature/bee-v6.3.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Nero 6.3.1 live wardrobe source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '6.3.1') { throw 'Wrong package version' }
          if ($pkg.build.appId -ne 'com.stenwick.nero') { throw 'appId changed unexpectedly' }

          $outfits = @(Get-ChildItem themes/default/assets/outfit-*.png)
          if ($outfits.Count -ne 88) { throw "Expected 88 tailored garment PNGs, found $($outfits.Count)" }

          foreach ($theme in Get-ChildItem themes -Directory) {
            if (-not (Test-Path "$($theme.FullName)/theme.json")) { continue }
            $json = Get-Content "$($theme.FullName)/theme.json" -Raw
            if ($json -notmatch 'body-dressed\.svg') { throw "Missing dressed body mapping: $($theme.Name)" }
            if ($json -notmatch 'hands-dressed\.svg') { throw "Missing dressed hands mapping: $($theme.Name)" }
            if (-not (Test-Path "$($theme.FullName)/assets/body-dressed.svg")) { throw "Missing body-dressed.svg: $($theme.Name)" }
            if (-not (Test-Path "$($theme.FullName)/assets/hands-dressed.svg")) { throw "Missing hands-dressed.svg: $($theme.Name)" }
          }

          node --check src/main/main.js
          node --check src/main/wardrobe.js
          node --check src/renderer/character/character.js
          node --check src/renderer/panel/panel.js
          Get-Content src/renderer/bee/release-notes.js -Raw | node --input-type=module --check

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate dialogue
        run: npm run dialogue:check

      - name: Bee window smoke test
        run: npx electron test/bee-window-electron-smoke.js

      - name: Build Windows installer
        run: npm run dist

      - name: Prepare release files and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item docs/ARICILIK-REHBERI.md OYUN-REHBERI.md -Force
          git archive --format=zip -o Nero-v6_3_1-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }

          $required = @(
            'dist/Nero-Setup-6.3.1.exe',
            'dist/Nero-Setup-6.3.1.exe.blockmap',
            'dist/latest.yml',
            'Nero-v6_3_1-source.zip',
            'CHANGELOG-6.3.1.md',
            'OYUN-REHBERI.md'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing final file: $f" }
          }

          $metadata = Get-Content dist/latest.yml -Raw
          if ($metadata -notmatch 'version: 6\.3\.1' -or $metadata -notmatch 'Nero-Setup-6\.3\.1\.exe') {
            throw 'Updater metadata mismatch'
          }

          $hashes = foreach ($f in $required) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($f))"
          }
          Set-Content SHA256SUMS-6.3.1.txt -Value $hashes -Encoding ascii

      - name: Upload Nero 6.3.1 final bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nero-6.3.1-final-bundle
          path: |
            dist/Nero-Setup-6.3.1.exe
            dist/Nero-Setup-6.3.1.exe.blockmap
            dist/latest.yml
            Nero-v6_3_1-source.zip
            CHANGELOG-6.3.1.md
            OYUN-REHBERI.md
            SHA256SUMS-6.3.1.txt
          if-no-files-found: error
          retention-days: 30
