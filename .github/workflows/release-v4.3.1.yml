name: Build Nero 4.3.1 Final

on:
  push:
    branches:
      - release-v4.3.1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }

      - name: Verify final version and syntax
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "4.3.1") { throw "Unexpected version: $($pkg.version)" }
          foreach ($path in @(
            "src/main/main.js",
            "src/preload/preload.js",
            "src/renderer/panel/panel.js",
            "src/renderer/character/character.js",
            "test/panel-pointer-electron-smoke.js",
            "test/moodboard-checkpoint-c-electron-smoke.js",
            "test/help-checkpoint-d-electron-smoke.js"
          )) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax error: $path" }
          }

      - name: Node regression tests
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Node tests failed" }

      - name: Window controls Electron hit-test
        shell: pwsh
        run: |
          $out = @(npx electron test/window-controls-electron-smoke.js 2>&1)
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "window-controls-electron-smoke: ok")) {
            throw "Window controls smoke failed"
          }

      - name: Repeated panel pointer gestures
        shell: pwsh
        run: |
          $out = @(npx electron test/panel-pointer-electron-smoke.js 2>&1)
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "panel-pointer-electron-smoke: ok")) {
            throw "Panel pointer smoke failed"
          }

      - name: Moodboard checkpoint C Electron smoke
        shell: pwsh
        run: |
          $out = @(npx electron test/moodboard-checkpoint-c-electron-smoke.js 2>&1)
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "moodboard-checkpoint-c-electron-smoke: ok")) {
            throw "Moodboard checkpoint C smoke failed"
          }

      - name: Help checkpoint D Electron smoke
        shell: pwsh
        run: |
          $out = @(npx electron test/help-checkpoint-d-electron-smoke.js 2>&1)
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "help-checkpoint-d-electron-smoke: ok")) {
            throw "Help checkpoint D smoke failed"
          }

      - name: Full panel integration Electron smoke
        shell: pwsh
        run: |
          $out = @(npx electron test/panel-integration-electron-smoke.js 2>&1)
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "Panel integration smoke failed" }

      - name: Moodboard PNG Electron smoke
        shell: pwsh
        run: |
          $out = @(npx electron test/moodboard-electron-smoke.js 2>&1)
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "Moodboard PNG smoke failed" }

      - name: Build final NSIS release
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }
          foreach ($path in @(
            "dist/Nero-Setup-4.3.1.exe",
            "dist/Nero-Setup-4.3.1.exe.blockmap",
            "dist/latest.yml"
          )) {
            if (-not (Test-Path $path)) { throw "Missing release file: $path" }
          }

      - name: Create source archive and checksums
        shell: pwsh
        run: |
          git archive --format=zip --output="dist/Nero-v4.3.1-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }
          $files = @(
            "dist/Nero-Setup-4.3.1.exe",
            "dist/Nero-Setup-4.3.1.exe.blockmap",
            "dist/latest.yml",
            "dist/Nero-v4.3.1-source.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii "dist/SHA256SUMS-4.3.1.txt"

      - name: Upload final release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nero-4.3.1-final-release
          path: |
            dist/Nero-Setup-4.3.1.exe
            dist/Nero-Setup-4.3.1.exe.blockmap
            dist/latest.yml
            dist/Nero-v4.3.1-source.zip
            dist/SHA256SUMS-4.3.1.txt
          if-no-files-found: error
