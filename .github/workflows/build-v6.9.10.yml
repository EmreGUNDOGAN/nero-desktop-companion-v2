name: Build Nero 6.9.10 Final
on:
  workflow_dispatch:
  push:
    branches: [feature/nero-v6.9.10]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run finance:check
      - name: Build React and Canvas finance UI
        run: npm run finance:build
      - name: Check complete collection
        run: node scripts/wardrobe-v665/check-release.js
      - run: npm test
      - run: npm run dialogue:check
      - name: Check panel and notification UI
        run: npx electron --disable-gpu test/nero-v690-ui-smoke.js
      - name: Check finance UI
        run: npx electron --disable-gpu test/budget-ui-smoke.js
      - name: Check Biletini Sakla theme UI
        run: npx electron --disable-gpu test/biletini-sakla-ui-smoke.js
      - name: Check three new theme screens
        run: npx electron --disable-gpu test/theme-trio-ui-smoke.js
      - name: Check character theme integration
        run: npx electron --disable-gpu test/theme-trio-character-smoke.js
      - name: Check Finans Merkezi UI
        run: npx electron --disable-gpu test/financial-dashboard-ui.cjs
      - name: Check comic main UI
        run: npx electron --disable-gpu test/comic-ui-smoke.cjs
      - name: Check comic finance UI
        run: npx electron --disable-gpu test/comic-finance-ui.cjs
      - name: Check comic character animation
        run: npx electron --disable-gpu test/comic-character-smoke.cjs
      - run: npm run dist
      - name: Export source
        run: git archive --format=zip -o Nero-v6_9_10-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Nero-6.9.10-final-bundle
          if-no-files-found: error
          path: |
            dist/Nero-Setup-6.9.10.exe
            dist/Nero-Setup-6.9.10.exe.blockmap
            dist/latest.yml
            Nero-v6_9_10-source.zip
            CHANGELOG-6.9.10.md
            OYUN-REHBERI.md
