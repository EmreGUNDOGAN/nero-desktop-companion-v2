name: Build Nero 6.3.0 Final Bundle

on:
  push:
    branches: [feature/bee-v6.3.0]
    paths:
      - ".release63/**"
      - ".github/workflows/build-v6.3.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify and apply Nero 6.3.0 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = ".release63\nero630_delta.tar.xz"
          if (-not (Test-Path $payload)) { throw "Missing 6.3.0 payload" }
          $expected = (Get-Content ".release63\PAYLOAD-SHA256.txt" -Raw).Trim().ToLowerInvariant()
          $actual = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Payload SHA256 mismatch: $actual" }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found" }
          & $sevenZip x -y $payload "-o$PWD"
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack xz payload" }
          if (-not (Test-Path "nero630_delta.tar")) { throw "Payload tar was not produced" }
          & $sevenZip x -y "nero630_delta.tar" "-o$PWD"
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack tar payload" }

          Remove-Item "nero630_delta.tar" -Force
          Remove-Item ".release63" -Recurse -Force

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne "6.3.0") { throw "package.json is not 6.3.0" }
          if ($pkg.build.appId -ne "com.stenwick.nero") { throw "appId changed unexpectedly" }

          Copy-Item docs/ARICILIK-REHBERI.md OYUN-REHBERI.md -Force

          $release = Get-Content CHANGELOG-6.3.0.md -Raw
          $aggregate = if (Test-Path CHANGELOG.md) { Get-Content CHANGELOG.md -Raw } else { "# Nero — Değişiklik Günlüğü`r`n`r`n" }
          if ($aggregate -notmatch '(?m)^##? Nero 6\.3\.0|^## 6\.3\.0') {
            $aggregate = $aggregate.TrimEnd() + "`r`n`r`n" + $release.Trim() + "`r`n"
            Set-Content CHANGELOG.md -Value $aggregate -Encoding utf8
          }

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax and 6.3.0 wardrobe inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mainFiles = @(
            "src/main/bee.js",
            "src/main/main.js",
            "src/main/stats.js",
            "src/main/wardrobe.js",
            "scripts/build-wardrobe.js",
            "src/renderer/panel/panel.js"
          )
          foreach ($m in $mainFiles) {
            node --check $m
            if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $m" }
          }

          $modules = @(
            "src/renderer/bee/bee.js",
            "src/renderer/bee/release-notes.js",
            "src/renderer/bee/evler/kit.js",
            "src/renderer/bee/gorsel/depo.js"
          )
          foreach ($m in $modules) {
            Get-Content $m -Raw | node --input-type=module --check
            if ($LASTEXITCODE -ne 0) { throw "Module syntax failed: $m" }
          }

          $themes = @("cilek","default","disket","ege","gece","kar","kasaba","latte","mum","pazartesi","yagmur")
          foreach ($theme in $themes) {
            $count = (Get-ChildItem "themes/$theme/assets/outfit-*.svg").Count
            if ($count -ne 91) { throw "Expected 91 wardrobe assets in $theme, got $count" }
          }

      - name: Run Node tests
        run: npm test

      - name: Validate desktop dialogue data
        run: npm run dialogue:check

      - name: Bee window Electron smoke
        run: npx electron test/bee-window-electron-smoke.js

      - name: Build Windows installer
        run: npm run dist

      - name: Prepare classic 6.3.0 release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item docs/ARICILIK-REHBERI.md OYUN-REHBERI.md -Force

          git add -A
          $stage = Join-Path $env:RUNNER_TEMP "nero-source-6.3.0"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          git ls-files | ForEach-Object {
            if ($_ -like ".release63/*") { return }
            $dest = Join-Path $stage $_
            $parent = Split-Path $dest -Parent
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $_ -Destination $dest
          }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "Nero-v6_3_0-source.zip" -CompressionLevel Optimal

          $required = @(
            "dist/Nero-Setup-6.3.0.exe",
            "dist/Nero-Setup-6.3.0.exe.blockmap",
            "dist/latest.yml",
            "Nero-v6_3_0-source.zip",
            "OYUN-REHBERI.md",
            "CHANGELOG-6.3.0.md"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing final file: $f" }
          }

          $metadata = Get-Content dist/latest.yml -Raw
          if ($metadata -notmatch 'version: 6\.3\.0') { throw "latest.yml version mismatch" }
          if ($metadata -notmatch 'Nero-Setup-6\.3\.0\.exe') { throw "latest.yml installer mismatch" }

          $lines = foreach ($f in $required) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($f))"
          }
          Set-Content -Path "SHA256SUMS-6.3.0.txt" -Value $lines -Encoding ascii

      - name: Upload classic Nero 6.3.0 final bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nero-6.3.0-final-bundle
          path: |
            dist/Nero-Setup-6.3.0.exe
            dist/Nero-Setup-6.3.0.exe.blockmap
            dist/latest.yml
            Nero-v6_3_0-source.zip
            OYUN-REHBERI.md
            CHANGELOG-6.3.0.md
            SHA256SUMS-6.3.0.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit finalized 6.3.0 source last
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- dist/ Nero-v6_3_0-source.zip SHA256SUMS-6.3.0.txt
          git diff --cached --check 2>&1 | Write-Host
          $global:LASTEXITCODE = 0
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No source changes to commit."
            exit 0
          }
          git commit -m "Release Nero 6.3.0 wardrobe and living island"
          git push origin HEAD:feature/bee-v6.3.0
