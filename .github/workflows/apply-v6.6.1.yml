name: Build Nero 6.6.1 Final

on:
  push:
    branches: [feature/bee-v6.6.1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified 6.6.1 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat             .github/nero661/part-00             .github/nero661/part-01             .github/nero661/part-02             .github/nero661/part-03a             .github/nero661/part-03b             .github/nero661/part-04             .github/nero661/part-05             .github/nero661/part-06 > /tmp/nero661.b64
          base64 -d /tmp/nero661.b64 > /tmp/nero661.patch.xz
          xz -dc /tmp/nero661.patch.xz > /tmp/nero661.patch
          git apply --check /tmp/nero661.patch
          git apply /tmp/nero661.patch

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-v6.6.1.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace("version: 6\\.6\\.0", "version: 6\\.6\\.1")
          s = s.replace("Nero-Setup-6\\.6\\.0\\.exe", "Nero-Setup-6\\.6\\.1\\.exe")
          p.write_text(s, encoding='utf-8')
          PY

          rm -rf .github/nero661
          rm -f .github/workflows/apply-v6.6.1.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete Nero 6.6.1 gameplay overhaul"
          git push origin HEAD:feature/bee-v6.6.1

  build:
    needs: apply
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bee-v6.6.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify final version and locked rules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '6.6.1') { throw "Wrong package version: $($pkg.version)" }
          $bee = Get-Content src/main/bee.js -Raw
          foreach ($rule in @(
            "coins: 300, cup: 'altın'",
            "coins: 200, cup: 'gümüş'",
            "coins: 100, cup: 'bronz'",
            'const FOCUS_BOOST = 0.10',
            'const UNATTENDED_CAP_MS = 2 * HOUR_MS',
            'letterSenderHistory',
            'pendingHoneyReturns',
            'competitiveNetWorth'
          )) {
            if ($bee -notmatch [regex]::Escape($rule)) { throw "Locked 6.6.1 rule missing: $rule" }
          }
          if (-not (Test-Path src/main/island-life-events.js)) { throw 'Island life events missing' }
          if (-not (Test-Path src/main/product-catalog.js)) { throw 'Product catalog missing' }
          if (-not (Test-Path docs/NERO-6.6.1-IMPLEMENTASYON-PLANI.md)) { throw 'Master implementation plan missing' }
          if (-not (Test-Path docs/NERO-6.6.1-DUZELTME-LISTESI.md)) { throw 'Fix checklist missing' }
          if (-not (Test-Path CHANGELOG-6.6.1.md)) { throw 'Changelog missing' }

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = @(npm test 2>&1)
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath Nero-6.6.1-test-report.txt
          if ($code -ne 0) { throw 'Node tests failed' }

      - name: Validate dialogue
        run: npm run dialogue:check

      - name: Bee window smoke test
        run: npx electron test/bee-window-electron-smoke.js

      - name: Build Windows installer
        run: npm run dist

      - name: Prepare final release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item docs/ARICILIK-REHBERI.md OYUN-REHBERI.md -Force
          git archive --format=zip -o Nero-v6_6_1-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }

          $required = @(
            'dist/Nero-Setup-6.6.1.exe',
            'dist/Nero-Setup-6.6.1.exe.blockmap',
            'dist/latest.yml',
            'Nero-v6_6_1-source.zip',
            'CHANGELOG-6.6.1.md',
            'OYUN-REHBERI.md',
            'docs/NERO-6.6.1-DUZELTME-LISTESI.md',
            'docs/NERO-6.6.1-IMPLEMENTASYON-PLANI.md',
            'Nero-6.6.1-test-report.txt'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing final file: $f" }
          }

          $metadata = Get-Content dist/latest.yml -Raw
          if ($metadata -notmatch 'version: 6\.6\.1' -or $metadata -notmatch 'Nero-Setup-6\.6\.1\.exe') {
            throw 'Updater metadata mismatch'
          }

          $hashes = foreach ($f in $required) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($f))"
          }
          Set-Content SHA256SUMS-6.6.1.txt -Value $hashes -Encoding ascii

      - name: Upload Nero 6.6.1 final bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nero-6.6.1-final-bundle
          path: |
            dist/Nero-Setup-6.6.1.exe
            dist/Nero-Setup-6.6.1.exe.blockmap
            dist/latest.yml
            Nero-v6_6_1-source.zip
            CHANGELOG-6.6.1.md
            OYUN-REHBERI.md
            docs/NERO-6.6.1-DUZELTME-LISTESI.md
            docs/NERO-6.6.1-IMPLEMENTASYON-PLANI.md
            Nero-6.6.1-test-report.txt
            SHA256SUMS-6.6.1.txt
          if-no-files-found: error
          retention-days: 30
