name: Visual QA Nero 4.3.1 help icons

on:
  push:
    branches:
      - validate-v4.3.1-visual

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        shell: pwsh
        run: npm ci

      - name: Capture theme screenshots
        shell: pwsh
        run: |
          @'
const { app, BrowserWindow } = require('electron');
const path = require('node:path');
const fs = require('node:fs');
const wait = ms => new Promise(r => setTimeout(r, ms));
const skins = ['latte','pazartesi','gece','disket','kasaba','yagmur','kar','cilek','mum','ege'];

app.whenReady().then(async () => {
  let win;
  try {
    fs.mkdirSync('visual-qa', { recursive:true });
    win = new BrowserWindow({
      width: 480,
      height: 820,
      show: false,
      frame: false,
      transparent: true,
      webPreferences: {
        preload: path.join(__dirname, 'test/panel-integration-preload.js'),
        contextIsolation: true,
        sandbox: false,
        nodeIntegration: false
      }
    });
    await win.loadFile(path.join(__dirname, 'src/renderer/panel/index.html'));
    await wait(450);

    for (const skin of skins) {
      await win.webContents.executeJavaScript(`
        document.documentElement.dataset.skin = ${JSON.stringify(skin)};
        document.querySelector('[data-tab="home"]').click();
        document.querySelectorAll('.section-help.open').forEach(x => x.classList.remove('open'));
        true;
      `);
      await wait(100);
      const image = await win.webContents.capturePage();
      fs.writeFileSync(path.join('visual-qa', skin + '-home.png'), image.toPNG());
    }

    for (const skin of ['kasaba','cilek','ege']) {
      await win.webContents.executeJavaScript(`
        document.documentElement.dataset.skin = ${JSON.stringify(skin)};
        document.querySelector('[data-tab="home"]').click();
        const help = document.querySelector('.desk .section-help');
        help.click();
        true;
      `);
      await wait(80);
      const image = await win.webContents.capturePage();
      fs.writeFileSync(path.join('visual-qa', skin + '-tooltip.png'), image.toPNG());
      await win.webContents.executeJavaScript(`document.querySelector('.section-help.open')?.click(); true;`);
    }
    console.log('visual-qa: ok');
  } catch (err) {
    console.error(err);
    process.exitCode = 1;
  } finally {
    if (win && !win.isDestroyed()) win.destroy();
    app.quit();
  }
});
'@ | Set-Content "visual-qa.js" -Encoding UTF8

          $out = @(npx electron visual-qa.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "visual-qa: ok")) {
            throw "Visual QA capture başarısız."
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Nero-v4.3.1-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
