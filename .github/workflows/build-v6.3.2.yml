name: Build Nero 6.3.2 Final Bundle

on:
  push:
    branches: [feature/bee-v6.3.2-full-character]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify source and wardrobe assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '6.3.2') { throw 'Wrong package version' }
          $outfits = @(Get-ChildItem themes/default/assets/outfit-*.png)
          if ($outfits.Count -ne 88) { throw "Expected 88 full character designs, found $($outfits.Count)" }
          foreach ($theme in Get-ChildItem themes -Directory) {
            if (-not (Test-Path "$($theme.FullName)/theme.json")) { continue }
            if (-not (Test-Path "$($theme.FullName)/assets/body.svg")) { throw "Missing original Nero body: $($theme.Name)" }
          }
          node --check src/renderer/character/character.js
          if ($LASTEXITCODE -ne 0) { throw 'Character syntax check failed' }
          Get-Content src/renderer/bee/release-notes.js -Raw | node --input-type=module --check
          if ($LASTEXITCODE -ne 0) { throw 'Release notes syntax check failed' }

      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate dialogue
        run: npm run dialogue:check
      - name: Bee window smoke test
        run: npx electron test/bee-window-electron-smoke.js
      - name: Build Windows installer
        run: npm run dist

      - name: Prepare source and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item docs/ARICILIK-REHBERI.md OYUN-REHBERI.md -Force
          git archive --format=zip -o Nero-v6_3_2-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $required = @(
            'dist/Nero-Setup-6.3.2.exe',
            'dist/Nero-Setup-6.3.2.exe.blockmap',
            'dist/latest.yml',
            'Nero-v6_3_2-source.zip',
            'CHANGELOG-6.3.2.md',
            'OYUN-REHBERI.md'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing final file: $f" }
          }
          $metadata = Get-Content dist/latest.yml -Raw
          if ($metadata -notmatch 'version: 6\.3\.2' -or $metadata -notmatch 'Nero-Setup-6\.3\.2\.exe') { throw 'Updater metadata mismatch' }
          $hashes = foreach ($f in $required) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($f))"
          }
          Set-Content SHA256SUMS-6.3.2.txt -Value $hashes -Encoding ascii

      - name: Upload Nero 6.3.2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nero-6.3.2-final-bundle
          path: |
            dist/Nero-Setup-6.3.2.exe
            dist/Nero-Setup-6.3.2.exe.blockmap
            dist/latest.yml
            Nero-v6_3_2-source.zip
            CHANGELOG-6.3.2.md
            OYUN-REHBERI.md
            SHA256SUMS-6.3.2.txt
          if-no-files-found: error
          retention-days: 30
