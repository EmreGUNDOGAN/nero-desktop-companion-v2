name: Validate Nero 4.3.1 UI fix

on:
  push:
    branches:
      - validate-v4.3.1-ui-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci başarısız." }

      - name: 4.3.1 sürüm ve syntax kontrolü
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "4.3.1") { throw "package version 4.3.1 değil." }
          $lockVersion = node -p "require('./package-lock.json').version"
          if ($lockVersion.Trim() -ne "4.3.1") { throw "package-lock 4.3.1 değil." }
          foreach ($path in @(
            "src/main/main.js",
            "src/main/stats.js",
            "src/preload/preload.js",
            "src/renderer/panel/panel.js"
          )) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax hatası: $path" }
          }

      - name: Tüm Node regression testleri
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Node testleri başarısız." }

      - name: Header gerçek Electron hit-test — tüm temalar
        shell: pwsh
        run: |
          $out = @(npx electron test/window-controls-electron-smoke.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "window-controls-electron-smoke: ok")) {
            throw "Header Electron smoke başarısız."
          }

      - name: Cross-theme yardım ikonu ve panel smoke
        shell: pwsh
        run: |
          $out = @(npx electron test/panel-integration-electron-smoke.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "panel-integration-electron-smoke: ok")) {
            throw "Panel cross-theme Electron smoke başarısız."
          }

      - name: 4.3.1 kaynak yapısı doğrulama
        shell: pwsh
        run: |
          $html = Get-Content "src/renderer/panel/index.html" -Raw
          $css = Get-Content "src/renderer/panel/panel.css" -Raw
          $skins = Get-Content "src/renderer/panel/skins.css" -Raw

          if ($html -notmatch 'class="panel-drag-zone"') { throw "Ayrı drag-zone eksik." }
          if ($css -notmatch '(?s)\.top\s*\{.*?-webkit-app-region:\s*no-drag') { throw "Header hâlâ drag." }
          if ($css -notmatch '(?s)\.panel-drag-zone\s*\{.*?-webkit-app-region:\s*drag') { throw "Drag-zone drag değil." }
          if ($css -notmatch '(?s)\.section-help\s*\{.*?width:\s*18px;.*?border:\s*0;.*?background:\s*transparent') { throw "Küçük borderless yardım ikonu CSS'i eksik." }
          if ($skins -notmatch "4.3.1 — küçük, border'sız yardım işaretleri") { throw "Tema help override eksik." }

      - name: Checkpoint kaynak ZIP oluştur
        shell: pwsh
        run: |
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          if (Test-Path ".git") { Remove-Item ".git" -Recurse -Force }
          if (Test-Path ".github/workflows") { Remove-Item ".github/workflows" -Recurse -Force }
          Compress-Archive -Path "*" -DestinationPath "Nero-v4.3.1-checkpoint-01-header-help-fix.zip" -Force

      - name: Checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nero-v4.3.1-checkpoint-01-header-help-fix
          path: Nero-v4.3.1-checkpoint-01-header-help-fix.zip
          if-no-files-found: error
