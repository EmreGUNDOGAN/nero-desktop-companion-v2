name: Build Nero 6.7.8 Final
on:
  workflow_dispatch:
  push:
    branches: [feature/bee-v6.7.8]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check complete collection
        run: node scripts/wardrobe-v665/check-release.js
      - run: npm test
      - run: npm run dist
      - name: Export source
        run: git archive --format=zip -o Nero-v6_7_8-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Nero-6.7.8-final-bundle
          if-no-files-found: error
          path: |
            dist/Nero-Setup-6.7.8.exe
            dist/Nero-Setup-6.7.8.exe.blockmap
            dist/latest.yml
            Nero-v6_7_8-source.zip
            CHANGELOG-6.7.8.md
