name: Build Nero 4.2.0 release artifacts

on:
  push:
    branches:
      - build-v4.2.0-ui-fix

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci başarısız." }

      - name: Kaynak bütünlüğünü doğrula
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "4.2.0") { throw "Beklenen sürüm 4.2.0, bulunan: $($pkg.version)" }

          $lockVersion = node -p "require('./package-lock.json').version"
          if ($lockVersion.Trim() -ne "4.2.0") { throw "package-lock sürümü 4.2.0 değil." }

          $dialogue = Get-Content "src/data/home-dialogues.tr.json" -Raw | ConvertFrom-Json
          if ($dialogue.dialogues.Count -ne 665) { throw "665 Home repliği eksik." }

          node -e "const a=require('./src/data/achievements'); const c=r=>a.filter(x=>x.rarity===r).length; if(a.length!==125||new Set(a.map(x=>x.id)).size!==125||c('yaygin')!==25||c('siradisi')!==35||c('nadir')!==20||c('efsanevi')!==20||c('gizli')!==25) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw "125 achievement dağılımı hatalı." }

          foreach ($path in @(
            "src/main/main.js",
            "src/main/journal.js",
            "src/main/moodboard.js",
            "src/main/moodboard-image.js",
            "src/preload/preload.js",
            "src/renderer/panel/panel.js"
          )) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax hatası: $path" }
          }

          foreach ($asset in @(
            "build/installer.nsh",
            "build/icon.ico",
            "build/icon.png",
            "build/installerSidebar.bmp",
            "build/installerHeader.bmp"
          )) {
            if (-not (Test-Path $asset)) { throw "Kurulum asseti eksik: $asset" }
          }

          $pkgText = Get-Content "package.json" -Raw
          foreach ($needle in @(
            '"include": "build/installer.nsh"',
            '"installerSidebar": "build/installerSidebar.bmp"',
            '"installerHeader": "build/installerHeader.bmp"',
            '"language": "1055"',
            '"artifactName": "Nero-Setup-${version}.exe"'
          )) {
            if ($pkgText -notmatch [regex]::Escape($needle)) { throw "Eski NSIS kurulum stili ayarı eksik: $needle" }
          }

      - name: Tüm testleri çalıştır
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Node testleri başarısız." }

      - name: Gerçek Electron moodboard PNG smoke testi
        shell: pwsh
        run: |
          if (-not (Test-Path "test/moodboard-electron-smoke.js")) { throw "Moodboard Electron smoke testi eksik." }
          $out = @(npx electron test/moodboard-electron-smoke.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "Electron PNG smoke testi başarısız." }
          if (($out -join [Environment]::NewLine) -notmatch "moodboard-electron-smoke: ok") {
            throw "Electron PNG smoke testi başarı işareti vermedi."
          }

      - name: Gerçek Electron header control hit-test smoke testi
        shell: pwsh
        run: |
          @'
const { app, BrowserWindow } = require('electron');
const path = require('node:path');

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const skins = ['kar', 'yagmur', 'cilek', 'mum', 'ege'];
const ids = ['settings-button', 'pin', 'minimize', 'close'];

app.whenReady().then(async () => {
  let win;
  try {
    win = new BrowserWindow({
      width: 720,
      height: 980,
      show: false,
      frame: false,
      webPreferences: { nodeIntegration: false, contextIsolation: true, sandbox: true }
    });
    await win.loadFile(path.join(__dirname, 'src/renderer/panel/index.html'));
    await wait(150);

    for (const skin of skins) {
      await win.webContents.executeJavaScript(`
        document.documentElement.dataset.skin = ${JSON.stringify(skin)};
        window.__controlHits = [];
        for (const id of ${JSON.stringify(ids)}) {
          const el = document.getElementById(id);
          if (!el) throw new Error('Eksik kontrol: ' + id);
          el.addEventListener('click', () => window.__controlHits.push(id), { capture: true, once: true });
        }
        true;
      `);
      await wait(80);

      for (const id of ids) {
        const rect = await win.webContents.executeJavaScript(`
          (() => {
            const r = document.getElementById(${JSON.stringify(id)}).getBoundingClientRect();
            return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2), w: r.width, h: r.height };
          })()
        `);
        if (!rect.w || !rect.h) throw new Error(`${skin}/${id} görünür değil.`);
        win.webContents.sendInput({ type: 'mouseDown', x: rect.x, y: rect.y, button: 'left', clickCount: 1 });
        win.webContents.sendInput({ type: 'mouseUp', x: rect.x, y: rect.y, button: 'left', clickCount: 1 });
        await wait(70);
        const hit = await win.webContents.executeJavaScript(`window.__controlHits.includes(${JSON.stringify(id)})`);
        if (!hit) throw new Error(`${skin}/${id} click hit-test başarısız.`);
      }
    }

    console.log('window-controls-electron-smoke: ok');
  } catch (err) {
    console.error(err);
    process.exitCode = 1;
  } finally {
    if (win && !win.isDestroyed()) win.destroy();
    app.quit();
  }
});
'@ | Set-Content "window-controls-smoke.js" -Encoding UTF8

          $out = @(npx electron "window-controls-smoke.js" 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          Remove-Item "window-controls-smoke.js" -Force
          if ($code -ne 0) { throw "Header kontrol hit-test smoke testi başarısız." }
          if (($out -join [Environment]::NewLine) -notmatch "window-controls-electron-smoke: ok") {
            throw "Header kontrol smoke testi başarı işareti vermedi."
          }

      - name: Gerçek NSIS setup oluştur
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw "electron-builder build başarısız." }

      - name: Release dosyalarını doğrula
        shell: pwsh
        run: |
          $setup = "dist/Nero-Setup-4.2.0.exe"
          $blockmap = "$setup.blockmap"
          $latest = "dist/latest.yml"

          foreach ($path in @($setup, $blockmap, $latest)) {
            if (-not (Test-Path $path)) { throw "Eksik release çıktısı: $path" }
          }

          $yml = Get-Content $latest -Raw
          if ($yml -notmatch "version:\s*4\.2\.0") { throw "latest.yml sürümü 4.2.0 değil." }
          if ($yml -notmatch "Nero-Setup-4\.2\.0\.exe") { throw "latest.yml setup adı hatalı." }

          & "C:\Program Files\7-Zip\7z.exe" l $setup | Tee-Object -Variable listing
          if ($LASTEXITCODE -ne 0) { throw "Setup 7-Zip ile okunamadı." }
          $joined = $listing -join [Environment]::NewLine
          if ($joined -notmatch "Type = Nsis") { throw "Setup gerçek NSIS installer değil." }

          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$sha  Nero-Setup-4.2.0.exe" | Set-Content "dist/Nero-Setup-4.2.0.exe.sha256" -Encoding ascii

      - name: Kaynak ZIP oluştur
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "nero-v4.2.0-source"
          New-Item -ItemType Directory -Force -Path $src | Out-Null

          Get-ChildItem "." -Force | Where-Object {
            $_.Name -notin @(".git","node_modules","dist",".github")
          } | ForEach-Object {
            Copy-Item $_.FullName $src -Recurse -Force
          }

          Compress-Archive -Path "$src\*" -DestinationPath "dist/nero-v4.2.0-kaynak.zip" -Force

          if (-not (Test-Path "dist/nero-v4.2.0-kaynak.zip")) { throw "Kaynak ZIP oluşmadı." }

      - name: CHANGELOG kopyala
        shell: pwsh
        run: |
          Copy-Item "CHANGELOG.md" "dist/CHANGELOG-4.2.0.md" -Force

      - name: Release artifactlerini yükle
        uses: actions/upload-artifact@v4
        with:
          name: Nero-4.2.0-release-files
          if-no-files-found: error
          path: |
            dist/Nero-Setup-4.2.0.exe
            dist/Nero-Setup-4.2.0.exe.blockmap
            dist/Nero-Setup-4.2.0.exe.sha256
            dist/latest.yml
            dist/nero-v4.2.0-kaynak.zip
            dist/CHANGELOG-4.2.0.md
