name: Validate Nero 4.3.0 final regression

on:
  push:
    branches:
      - validate-v4.3.0-final-regression2

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci başarısız." }
          npm ls --depth=0
          if ($LASTEXITCODE -ne 0) { throw "Bağımlılık ağacı tutarsız." }

      - name: Tüm ana JS dosyalarında syntax kontrolü
        shell: pwsh
        run: |
          $files = @(
            "src/main/main.js",
            "src/main/stats.js",
            "src/main/moodboard.js",
            "src/main/moodboard-image.js",
            "src/main/journal.js",
            "src/main/store.js",
            "src/main/todo-stopwatch.js",
            "src/preload/preload.js",
            "src/renderer/panel/panel.js"
          )
          foreach ($path in $files) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax hatası: $path" }
          }

      - name: Tüm Node regression testleri
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Node testleri başarısız." }

      - name: Header kontrolleri gerçek Electron hit-test
        shell: pwsh
        run: |
          $out = @(npx electron test/window-controls-electron-smoke.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "window-controls-electron-smoke: ok")) {
            throw "Header Electron smoke başarısız."
          }

      - name: Moodboard PNG gerçek Electron smoke
        shell: pwsh
        run: |
          $out = @(npx electron test/moodboard-electron-smoke.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "moodboard-electron-smoke: ok")) {
            throw "Moodboard PNG Electron smoke başarısız."
          }

      - name: Panel 4.3.0 cross-theme gerçek Electron entegrasyon testi
        shell: pwsh
        run: |
          $out = @(npx electron test/panel-integration-electron-smoke.js 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or (($out -join [Environment]::NewLine) -notmatch "panel-integration-electron-smoke: ok")) {
            throw "Panel cross-theme Electron smoke başarısız."
          }

      - name: Release yapılandırması statik doğrulama
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "4.3.0") { throw "package version 4.3.0 değil." }
          if ($pkg.build.nsis.oneClick -ne $false) { throw "Eski assisted NSIS setup stili korunmamış." }
          if ($pkg.build.nsis.perMachine -ne $false) { throw "NSIS perMachine yanlış." }
          if ($pkg.build.nsis.allowToChangeInstallationDirectory -ne $true) { throw "Kurulum dizini seçimi korunmamış." }
          if ($pkg.build.nsis.artifactName -ne 'Nero-Setup-${version}.exe') { throw "Setup artifact adı değişmiş." }
          foreach ($path in @(
            "build/installer.nsh",
            "build/icon.ico",
            "build/icon.png",
            "build/installerSidebar.bmp",
            "build/installerHeader.bmp"
          )) {
            if (-not (Test-Path $path)) { throw "Paketleme asseti eksik: $path" }
          }

      - name: Final regression checkpoint kaynak ZIP oluştur
        shell: pwsh
        run: |
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          if (Test-Path ".git") { Remove-Item ".git" -Recurse -Force }
          if (Test-Path ".github/workflows") { Remove-Item ".github/workflows" -Recurse -Force }
          Compress-Archive -Path "*" -DestinationPath "Nero-v4.3.0-checkpoint-04-final-regression.zip" -Force

      - name: Checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nero-v4.3.0-checkpoint-04-final-regression
          path: Nero-v4.3.0-checkpoint-04-final-regression.zip
          if-no-files-found: error
