name: Nero 4.1.0 gerçek NSIS test build

on:
  push:
    branches: [build-v4.1.0-real-installer]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Build dalını al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nero 4.0.4 gerçek installer'ını release'ten indir
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path base | Out-Null
          $releases = gh release list --limit 100 --json tagName,name | ConvertFrom-Json
          $rel = $releases | Where-Object { $_.tagName -match '4\.0\.4' -or $_.name -match '4\.0\.4' } | Select-Object -First 1
          if (-not $rel) { throw "4.0.4 GitHub Release bulunamadı." }
          Write-Host "Baz release: $($rel.tagName)"
          gh release download $rel.tagName --pattern "Nero-Setup-4.0.4.exe" --dir base
          if (-not (Test-Path "base/Nero-Setup-4.0.4.exe")) { throw "Nero-Setup-4.0.4.exe release asset bulunamadı." }

      - name: 4.0.4 installer içinden kaynakları ve setup assetlerini çıkar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path base/nsis | Out-Null
          & 7z x "base/Nero-Setup-4.0.4.exe" "-obase/nsis" -y
          if ($LASTEXITCODE -ne 0) { throw "4.0.4 installer açılamadı." }

          $appArchive = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -match '^app-.*\.7z$' } | Select-Object -First 1
          if (-not $appArchive) { throw "Installer içinde app-*.7z bulunamadı." }

          $oldHeader = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-header.bmp' } | Select-Object -First 1
          $oldWizard = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-wizard.bmp' } | Select-Object -First 1
          $oldIcon = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'uninstallerIcon.ico' } | Select-Object -First 1
          if (-not $oldHeader -or -not $oldWizard -or -not $oldIcon) { throw "4.0.4 setup görsel assetleri çıkarılamadı." }

          New-Item -ItemType Directory -Force -Path base/app | Out-Null
          & 7z x $appArchive.FullName "-obase/app" -y
          if ($LASTEXITCODE -ne 0) { throw "4.0.4 uygulama payload'u açılamadı." }
          if (-not (Test-Path "base/app/resources/app.asar")) { throw "4.0.4 app.asar bulunamadı." }

          npm install --global @electron/asar
          if ($LASTEXITCODE -ne 0) { throw "@electron/asar kurulamadı." }
          asar extract "base/app/resources/app.asar" "project"
          if ($LASTEXITCODE -ne 0) { throw "app.asar kaynakları çıkarılamadı." }

          if (Test-Path "project/node_modules") { Remove-Item "project/node_modules" -Recurse -Force }
          if (Test-Path "project/themes") { Remove-Item "project/themes" -Recurse -Force }
          Copy-Item "base/app/resources/themes" "project/themes" -Recurse -Force

          New-Item -ItemType Directory -Force -Path "project/build" | Out-Null
          Copy-Item $oldIcon.FullName "project/build/icon.ico" -Force
          Copy-Item $oldHeader.FullName "project/build/installerHeader.bmp" -Force
          Copy-Item $oldWizard.FullName "project/build/installerSidebar.bmp" -Force

          $nsh = Get-Content "build-input/installer-4.0.4.nsh" -Raw
          [IO.File]::WriteAllText((Resolve-Path "project/build").Path + "\\installer.nsh", [char]0xFEFF + $nsh, [Text.UTF8Encoding]::new($false))

      - name: 4.1.0 runtime patchlerini uygula
        shell: pwsh
        run: |
          $raw = Get-Content "build-input/NERO_v4.0.4_to_v4.1.0.patch" -Raw
          $raw = $raw.Replace("/tmp/nero404_orig/nero/","a/").Replace("/mnt/data/nero410_work/nero/","b/")
          [IO.File]::WriteAllText((Join-Path $PWD "main-normalized.patch"), $raw, [Text.UTF8Encoding]::new($false))

          # Bu patch kaynak paketine göre üretildiği için README/package-lock gibi app.asar içinde
          # bulunmayan geliştirme dosyalarında uyarı verebilir. Runtime dosyaları uygulanır,
          # ardından aşağıdaki doğrulamalar eksik/yarım uygulamayı build'den önce kesin olarak yakalar.
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../main-normalized.patch || true"
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../build-input/NERO_4.1.0_click_fix.patch || true"

          # app.asar içindeki package.json üretim için budanmış olabilir; build konfigürasyonunu
          # 4.1.0 final kaynakla birebir ve deterministik olarak yeniden yaz.
          $pkgB64 = ""
          [IO.File]::WriteAllBytes((Join-Path $PWD "project/package.json"), [Convert]::FromBase64String($pkgB64))
          if (Test-Path "project/package-lock.json") { Remove-Item "project/package-lock.json" -Force }

          # Final test dosyası app.asar içinde doğal olarak bulunmaz; build girdisinden ekle.
          New-Item -ItemType Directory -Force -Path "project/test" | Out-Null
          Copy-Item "build-input/home-dialogue.test.js" "project/test/home-dialogue.test.js" -Force

      - name: Achievement v2 (125 rozet) patchini uygula
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-input/achievements-runtime-b64.part*" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Achievement patch parçaları eksik: $($parts.Count)/7" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes((Join-Path $PWD "ach.patch.gz"), [Convert]::FromBase64String($b64))
          $gzHash = (Get-FileHash "ach.patch.gz" -Algorithm SHA256).Hash.ToLower()
          if ($gzHash -ne "e41f62c2c7220ec9d3f8251ef769325a6dbc8f024c254eb17f4b144e324f282c") { throw "Achievement patch gzip checksum uyuşmuyor: $gzHash" }

          & "C:\Program Files\Git\bin\bash.exe" -lc "gzip -dc ach.patch.gz > ach.raw.patch"
          if ($LASTEXITCODE -ne 0) { throw "Achievement patch arşivi açılamadı." }
          $rawHash = (Get-FileHash "ach.raw.patch" -Algorithm SHA256).Hash.ToLower()
          if ($rawHash -ne "7c245e004f7766269c7f93438ae17a8cd39167d26970958f7aa79f41d57f26cf") { throw "Achievement runtime patch checksum uyuşmuyor: $rawHash" }

          $raw = Get-Content "ach.raw.patch" -Raw
          $raw = $raw.Replace("nero410_base_for_ach/nero/","a/").Replace("nero411_work/nero/","b/")
          [IO.File]::WriteAllText((Join-Path $PWD "ach-normalized.patch"), $raw, [Text.UTF8Encoding]::new($false))

          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../ach-normalized.patch"
          if ($LASTEXITCODE -ne 0) { throw "125 achievement patch'i uygulanamadı." }

      - name: Rozet rarity sekmelerini uygula
        shell: pwsh
        run: |
          $b64 = Get-Content "build-input/badges-rarity-tabs.patch.b64" -Raw
          [IO.File]::WriteAllBytes((Join-Path $PWD "badges-rarity-tabs.patch"), [Convert]::FromBase64String($b64))
          $patchHash = (Get-FileHash "badges-rarity-tabs.patch" -Algorithm SHA256).Hash.ToLower()
          if ($patchHash -ne "5292fb57f640f2f34ad604b7e14e32b51d8992ffc6cbc5d91842bed53c3d69b7") { throw "Rozet rarity patch checksum uyuşmuyor: $patchHash" }
          & "C:\Program Files\Git\bin\bash.exe" -lc "cd project && patch -p1 --batch --forward < ../badges-rarity-tabs.patch"
          if ($LASTEXITCODE -ne 0) { throw "Rozet rarity sekmeleri patch'i uygulanamadı." }

      - name: Setup ve tema uyumluluğunu doğrula
        shell: pwsh
        run: |
          $pkg = Get-Content "project/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "4.1.0") { throw "Sürüm 4.1.0 değil." }
          if ($pkg.build.nsis.include -ne "build/installer.nsh") { throw "installer.nsh bağlantısı eksik." }
          if ($pkg.build.nsis.installerSidebar -ne "build/installerSidebar.bmp") { throw "Eski sidebar kullanılmıyor." }
          if ($pkg.build.nsis.uninstallerSidebar -ne "build/installerSidebar.bmp") { throw "Eski uninstaller sidebar kullanılmıyor." }
          if ($pkg.build.nsis.installerHeader -ne "build/installerHeader.bmp") { throw "Eski header kullanılmıyor." }
          if ([string]$pkg.build.nsis.language -ne "1055") { throw "Türkçe installer dili korunmamış." }
          if ($pkg.build.nsis.installerLanguages -notcontains "tr_TR") { throw "tr_TR installer dili korunmamış." }

          $oldHeader = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-header.bmp' } | Select-Object -First 1
          $oldWizard = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-wizard.bmp' } | Select-Object -First 1
          $oldIcon = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'uninstallerIcon.ico' } | Select-Object -First 1

          if ((Get-FileHash $oldHeader.FullName -Algorithm SHA256).Hash -ne (Get-FileHash "project/build/installerHeader.bmp" -Algorithm SHA256).Hash) { throw "Header birebir değil." }
          if ((Get-FileHash $oldWizard.FullName -Algorithm SHA256).Hash -ne (Get-FileHash "project/build/installerSidebar.bmp" -Algorithm SHA256).Hash) { throw "Sidebar birebir değil." }
          if ((Get-FileHash $oldIcon.FullName -Algorithm SHA256).Hash -ne (Get-FileHash "project/build/icon.ico" -Algorithm SHA256).Hash) { throw "Installer icon birebir değil." }

          if (-not (Test-Path "project/themes")) { throw "Temalar klasörü eksik." }
          if (-not (Get-ChildItem "project/themes" -Recurse -File | Select-Object -First 1)) { throw "Temalar klasörü boş." }

          $panel = Get-Content "project/src/renderer/panel/panel.js" -Raw
          if ($panel -match "home:dismiss") { throw "Eski home:dismiss davranışı hâlâ panel.js içinde." }

      - name: Runtime dosyalarını ve 665 repliği doğrula
        shell: pwsh
        working-directory: project
        run: |
          foreach ($path in @(
            "src/data/home-dialogues.tr.json",
            "src/main/home-dialogue.js",
            "src/main/main.js",
            "src/main/stats.js",
            "src/preload/preload.js",
            "src/renderer/panel/index.html",
            "src/renderer/panel/panel.css",
            "src/renderer/panel/panel.js",
            "test/home-dialogue.test.js"
          )) {
            if (-not (Test-Path $path)) { throw "Eksik 4.1.0 dosyası: $path" }
          }

          $dialogue = Get-Content "src/data/home-dialogues.tr.json" -Raw | ConvertFrom-Json
          if ($dialogue.dialogues.Count -ne 665) { throw "665 repliğin tamamı uygulanmamış." }

          node -e "const a=require('./src/data/achievements'); const c=r=>a.filter(x=>x.rarity===r).length; if(a.length!==125||new Set(a.map(x=>x.id)).size!==125||c('yaygin')!==25||c('siradisi')!==35||c('nadir')!==20||c('efsanevi')!==20||c('gizli')!==25) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw "125 achievement veri dağılımı doğrulanamadı." }

          $panelHtml = Get-Content "src/renderer/panel/index.html" -Raw
          if ($panelHtml.IndexOf('data-tab="timer"') -gt $panelHtml.IndexOf('data-tab="badges"')) { throw "Sekme sırası Sayaç -> Rozetler değil." }
          $panelJs = Get-Content "src/renderer/panel/panel.js" -Raw
          if ($panelJs -notmatch "completedDesc" -or $panelJs -notmatch "badge-tooltip") { throw "Tamamlanan rozet hover açıklaması eksik." }
          if ($panelHtml -notmatch 'data-rarity="yaygin"' -or $panelHtml -notmatch 'data-rarity="siradisi"' -or $panelHtml -notmatch 'data-rarity="nadir"' -or $panelHtml -notmatch 'data-rarity="efsanevi"') { throw "Rozet rarity sekmeleri HTML içinde eksik." }
          if ($panelJs -notmatch "activeBadgeRarity" -or $panelJs -notmatch "discoveredHidden") { throw "Rozet rarity filtreleme davranışı eksik." }
          if ($panelHtml -match 'badges-more') { throw "Eski tek liste / daha fazla rozet butonu hâlâ mevcut." }

          node --check "src/main/home-dialogue.js"
          if ($LASTEXITCODE -ne 0) { throw "home-dialogue.js syntax hatası." }
          node --check "src/main/main.js"
          if ($LASTEXITCODE -ne 0) { throw "main.js syntax hatası." }
          node --check "src/renderer/panel/panel.js"
          if ($LASTEXITCODE -ne 0) { throw "panel.js syntax hatası." }

      - name: Bağımlılıkları kur ve testleri çalıştır
        shell: pwsh
        working-directory: project
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install başarısız." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Testler başarısız." }

      - name: 4.0.4 ile aynı Electron Builder + NSIS zincirinden setup üret
        shell: pwsh
        working-directory: project
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw "electron-builder / NSIS build başarısız." }
          if (-not (Test-Path "dist/Nero-Setup-4.1.0.exe")) { throw "Nero-Setup-4.1.0.exe oluşmadı." }

      - name: Oluşan setup'ın gerçek 4.0.4 tasarımını koruduğunu tekrar doğrula
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path verify/nsis | Out-Null
          & 7z x "project/dist/Nero-Setup-4.1.0.exe" "-overify/nsis" -y
          if ($LASTEXITCODE -ne 0) { throw "4.1.0 setup doğrulama için açılamadı." }

          $newHeader = Get-ChildItem "verify/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-header.bmp' } | Select-Object -First 1
          $newWizard = Get-ChildItem "verify/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-wizard.bmp' } | Select-Object -First 1
          $newIcon = Get-ChildItem "verify/nsis" -Recurse -File | Where-Object { $_.Name -eq 'uninstallerIcon.ico' } | Select-Object -First 1
          $oldHeader = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-header.bmp' } | Select-Object -First 1
          $oldWizard = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'modern-wizard.bmp' } | Select-Object -First 1
          $oldIcon = Get-ChildItem "base/nsis" -Recurse -File | Where-Object { $_.Name -eq 'uninstallerIcon.ico' } | Select-Object -First 1

          if (-not $newHeader -or -not $newWizard -or -not $newIcon) { throw "4.1.0 setup custom görselleri içermiyor." }
          if ((Get-FileHash $newHeader.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $oldHeader.FullName -Algorithm SHA256).Hash) { throw "4.1.0 header eski setup ile aynı değil." }
          if ((Get-FileHash $newWizard.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $oldWizard.FullName -Algorithm SHA256).Hash) { throw "4.1.0 sidebar eski setup ile aynı değil." }
          if ((Get-FileHash $newIcon.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $oldIcon.FullName -Algorithm SHA256).Hash) { throw "4.1.0 icon eski setup ile aynı değil." }

          $newAppArchive = Get-ChildItem "verify/nsis" -Recurse -File | Where-Object { $_.Name -match '^app-.*\.7z$' } | Select-Object -First 1
          if (-not $newAppArchive) { throw "4.1.0 payload bulunamadı." }
          New-Item -ItemType Directory -Force -Path verify/app | Out-Null
          & 7z x $newAppArchive.FullName "-overify/app" -y | Out-Null
          if (-not (Test-Path "verify/app/resources/app.asar")) { throw "4.1.0 app.asar bulunamadı." }
          asar extract "verify/app/resources/app.asar" "verify/project"
          $vpkg = Get-Content "verify/project/package.json" -Raw | ConvertFrom-Json
          if ($vpkg.version -ne "4.1.0") { throw "Setup içindeki uygulama 4.1.0 değil." }
          $vpanel = Get-Content "verify/project/src/renderer/panel/panel.js" -Raw
          if ($vpanel -match "home:dismiss") { throw "Setup payload'unda click-dismiss hatası geri gelmiş." }
          if (-not (Test-Path "verify/project/src/data/home-dialogues.tr.json")) { throw "665 replik dosyası setup payload'unda yok." }
          $dialogue = Get-Content "verify/project/src/data/home-dialogues.tr.json" -Raw | ConvertFrom-Json
          if ($dialogue.dialogues.Count -ne 665) { throw "Setup payload'unda 665 repliğin tamamı yok." }

          Push-Location "verify/project"
          node -e "const a=require('./src/data/achievements'); if(a.length!==125||new Set(a.map(x=>x.id)).size!==125) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "Setup payload'unda 125 achievement yok." }
          Pop-Location
          $vpanelHtml = Get-Content "verify/project/src/renderer/panel/index.html" -Raw
          if ($vpanelHtml.IndexOf('data-tab="timer"') -gt $vpanelHtml.IndexOf('data-tab="badges"')) { throw "Setup payload'unda sekme sırası yanlış." }
          if ($vpanel -notmatch "completedDesc" -or $vpanel -notmatch "badge-tooltip") { throw "Setup payload'unda achievement tooltip sistemi eksik." }
          if ($vpanelHtml -notmatch 'data-rarity="yaygin"' -or $vpanelHtml -notmatch 'data-rarity="siradisi"' -or $vpanelHtml -notmatch 'data-rarity="nadir"' -or $vpanelHtml -notmatch 'data-rarity="efsanevi"') { throw "Setup payload'unda rozet rarity sekmeleri eksik." }
          if ($vpanel -notmatch "activeBadgeRarity" -or $vpanel -notmatch "discoveredHidden") { throw "Setup payload'unda rarity filtreleme eksik." }
          if ($vpanelHtml -match 'badges-more') { throw "Setup payload'unda eski tek liste görünümü kalmış." }

      - name: Installer dosyalarını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Nero-4.1.0-real-installer
          path: |
            project/dist/Nero-Setup-4.1.0.exe
            project/dist/Nero-Setup-4.1.0.exe.blockmap
            project/dist/latest.yml
          if-no-files-found: error
