name: Hata bildirimi
description: Nero'da tekrar üretilebilen bir sorunu bildir
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Sorun
      description: Ne olduğunu açıkla.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden üretme adımları
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nero sürümü
      placeholder: 3.8.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows sürümü
      placeholder: Windows 11 24H2
  - type: textarea
    id: extra
    attributes:
      label: Ek bilgi
      description: Ekran görüntüsü veya kişisel bilgiler temizlenmiş log ekleyebilirsin.
