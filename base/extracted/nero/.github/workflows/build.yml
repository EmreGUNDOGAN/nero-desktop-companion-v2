name: Windows kurulum dosyasını oluştur

# Her push'ta ve elle çalıştırıldığında Nero-Setup-x.y.z.exe üretir.
# "v" ile başlayan bir etiket (ör. v3.0.0) gönderildiğinde ayrıca bir GitHub Release oluşturur.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Kurulum dosyasını oluştur
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Kurulum dosyasını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: Nero-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Etiketliyse sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Otomatik güncelleme için üç dosya da gerekli: kurulum, blockmap ve latest.yml
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
